name: Build & Deploy React App to Kubernetes

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ar2

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          IMAGE=ghcr.io/${{ github.actor }}/react-sample-app:${{ github.sha }}
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          docker build -t $IMAGE .

      - name: Push Docker image
        run: |
          docker push $IMAGE

      - name: Replace image in deployment.yaml
        run: |
          sed -i "s|image: .*|image: ${IMAGE}|g" k8s/deployment.yaml

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

    #   - name: Set kubeconfig
    #     run: |
    #       echo "${{ secrets.KUBECONFIG_DATA }}" > kubeconfig
    #     shell: bash

      - name: Apply Kubernetes manifests
        env:
          KUBECONFIG: ./kubeconfig
        run: |
          kubectl apply -f k8s/deployment.yaml
